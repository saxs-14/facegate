<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <title>FaceGate — Face-Based Visitor Access Management</title>
    <meta name="description" content="Replace the paper register with face-based check-in. Enrolled with consent, matched with a configurable confidence threshold, fully auditable access history." />
    <link rel="canonical" href="https://facegate-saxs-14s-projects.vercel.app/" />

    <!-- Static OG/Twitter tags: social-preview crawlers (Slack, Twitter, WhatsApp, LinkedIn)
         generally don't execute JS, so the per-route tags react-helmet-async injects at
         runtime (see Landing.tsx / Dashboard.tsx) aren't visible to them. These static
         tags are the fallback those crawlers actually see; Helmet's versions still apply
         for JS-executing crawlers (Google) and override these on route change. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FaceGate — Face-Based Visitor Access Management" />
    <meta property="og:description" content="Replace the paper register with face-based check-in. Enrolled with consent, matched with a configurable confidence threshold, fully auditable access history." />
    <meta property="og:url" content="https://facegate-saxs-14s-projects.vercel.app/" />
    <meta property="og:image" content="https://facegate-saxs-14s-projects.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FaceGate — Face-Based Visitor Access Management" />
    <meta name="twitter:description" content="Replace the paper register with face-based check-in. Enrolled with consent, matched with a configurable confidence threshold, fully auditable access history." />
    <meta name="twitter:image" content="https://facegate-saxs-14s-projects.vercel.app/og-image.png" />
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
